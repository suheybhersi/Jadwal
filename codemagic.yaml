workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        provisioning_profiles:
          - jadwal_app_store_profile
        certificates:
          - Distribution_certificate
      vars:
        API_KEY: $API_KEY
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: xcode-project use-profiles
        script: xcode-project use-profiles
      - name: Flutter packages pub get
        script: flutter packages pub get
      - name: Flutter build ipa and automatic versioning
        script: |
          flutter build ipa-export-options-plist=/Users/builder/export_options.plist
      - name: Flutter build ipa and automatic versioning
        script: |
          # See the following link about getting the latest App Store or TestFlight version - https://docs.codemagic.io/knowledge-codemagic/build-versioning/#app-store-or-testflight-latest-build-number
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - suheybhersi@gmail.com
        notify:
          success: true # To receive a notification when a build succeeds
          failure: true # To not receive a notification when a build fails
