workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.suheyb.jadwal
        provisioning_profiles:
          - jadwal_development_profile
        certificates:
          - Development_certificate
      vars:
        API_KEY: $API_KEY
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: xcode-project use-profiles
        script: xcode-project use-profiles
      - name: Flutter packages pub get
        script: flutter packages pub get
      - name: Flutter build ipa and automatic versioning
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - suheybhersi@gmail.com
        notify:
          success: true # To receive a notification when a build succeeds
          failure: true # To not receive a notification when a build fails
